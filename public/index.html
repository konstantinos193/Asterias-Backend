<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Asterias Homes API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300&family=Alegreya+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #8B4B5C;
      --primary-dark: #7a3f4e;
      --secondary: #E8E2D5;
      --text: #1e1e1e;
      --text-muted: #6b6464;
      --border: rgba(139, 75, 92, 0.14);
      --white: #ffffff;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Alegreya Sans', system-ui, sans-serif;
      background-color: var(--secondary);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }

    img.logo {
      height: 64px;
      width: auto;
      margin-bottom: 1.75rem;
    }

    .badge {
      display: inline-block;
      background: var(--primary);
      color: var(--white);
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.3rem 0.65rem;
      border-radius: 2px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: 'Cormorant', Georgia, serif;
      font-weight: 300;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    h1 em {
      display: block;
      font-style: italic;
      color: var(--primary);
    }

    p.lead {
      color: var(--text-muted);
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.6;
      max-width: 34ch;
      margin: 1.25rem auto 0;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--border);
      margin: 2.25rem auto;
    }

    a.btn {
      display: inline-block;
      background: var(--primary);
      color: var(--white);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      padding: 0.7rem 1.6rem;
      border-radius: 3px;
      transition: background 0.15s;
    }

    a.btn:hover, a.btn:focus-visible { background: var(--primary-dark); }

    a.btn:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    footer {
      margin-top: 3.5rem;
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 300;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
    }

    footer a:hover { color: var(--primary); }
  </style>
</head>
<body>

  <main>
    <img class="logo" src="/asterias-logo.avif" alt="Asterias Homes">
    <span class="badge">API</span>
    <h1>Asterias Homes<br><em>Backend API</em></h1>
    <p class="lead">Nothing to see here. This is just the server behind asteriashome.gr.</p>

    <div class="divider"></div>

    <a class="btn" href="https://asteriashome.gr">Go to asteriashome.gr</a>
  </main>

  <footer>
    &copy; Asterias Homes &middot; built by
    <a href="https://adinfinity.gr/" target="_blank" rel="noopener noreferrer">adinfinity</a>
  </footer>

</body>
</html>
