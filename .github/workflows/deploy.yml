name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Queue deploys, never cancel them. A cancel can land mid-cutover, after the
  # old container is stopped but before nginx is repointed, which leaves the
  # host serving 502s until someone notices.
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: konstantinos193/asterias-backend

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: image
        run: echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Attempt 1 of 2. The image builds fine; what fails intermittently is the
      # upload -- ghcr answers a blob HEAD during layer push with a bare 403,
      # minutes after the same layers pushed cleanly with the same token. It is
      # registry-side, so the only real fix is to try again.
      - name: Build and push
        id: push_attempt_1
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,timeout=5m
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Attempt 2 of 2. Runs only when the first push failed. The builder still
      # holds every layer from attempt 1, so this re-push costs seconds, not a
      # rebuild.
      - name: Build and push (retry)
        if: steps.push_attempt_1.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,timeout=5m
          github-token: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Blue-green deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: SSH and cut over on the VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          # Nothing compiles here any more -- this is a pull and a cutover.
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd /root/asterias-backend
            git fetch origin
            git reset --hard origin/main
            bash scripts/deploy.sh "$IMAGE"
