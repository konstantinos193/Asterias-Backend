# TLS: certificates and protocol policy.
#
# The certificates here are the ones certbot already manages and renews. Using
# them means the nginx -> Traefik cutover cannot fail on ACME: the certs are
# already on disk and already valid. Traefik only reads them.
#
# Once the cutover is confirmed stable, switching to Traefik-managed ACME is a
# one-flag change (see docker-compose.traefik.yml) and these entries become the
# fallback for anything ACME has not issued yet.
#
# certbot's own renewal hook needs updating at that point either way -- it was
# installed with the nginx plugin, which cannot work once nginx is gone. The
# install script prints the exact situation.

tls:
  certificates:
    - certFile: /etc/letsencrypt/live/api.asteriashome.gr/fullchain.pem
      keyFile: /etc/letsencrypt/live/api.asteriashome.gr/privkey.pem
    - certFile: /etc/letsencrypt/live/api.kyklosedu.gr/fullchain.pem
      keyFile: /etc/letsencrypt/live/api.kyklosedu.gr/privkey.pem
    - certFile: /etc/letsencrypt/live/api.adinfinity.gr/fullchain.pem
      keyFile: /etc/letsencrypt/live/api.adinfinity.gr/privkey.pem
    - certFile: /etc/letsencrypt/live/mail.adinfinity.gr/fullchain.pem
      keyFile: /etc/letsencrypt/live/mail.adinfinity.gr/privkey.pem

  options:
    default:
      # TLS 1.2 floor. 1.0/1.1 are dead and nothing that talks to these APIs
      # needs them; Booking.com and Stripe both do 1.2+.
      minVersion: VersionTLS12
      # Only matters for TLS 1.2 -- 1.3 negotiates its own suites. These are
      # the forward-secret AEAD suites, no CBC and no RSA key exchange.
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      curvePreferences:
        - X25519
        - CurveP256
      sniStrict: false

  # A TLS connection for a hostname Traefik does not route gets this cert and
  # nothing else. Without a default, Traefik serves the first cert it finds to
  # scanners probing by IP, which leaks which domains live here.
  stores:
    default:
      defaultCertificate:
        certFile: /etc/letsencrypt/live/api.asteriashome.gr/fullchain.pem
        keyFile: /etc/letsencrypt/live/api.asteriashome.gr/privkey.pem
