# AppSec rule bundle for this box.
#
# Why this file exists at all: the shipped crowdsecurity/appsec-default config
# leaves the OWASP Core Rule Set out. With the default, the WAF blocks known
# CVE paths and .env/.git probes but passes generic SQLi, traversal, XSS and
# command injection in a query string straight through to the app. Measured on
# this host before CRS was added: 8 requests processed, 2 blocked, and the only
# rules that ever fired were vpatch-env-access and vpatch-git-config.
#
# CRS runs INBAND, i.e. it blocks the offending request rather than only
# raising an alert. That is the stronger setting and the usual objection is
# false positives on free text. It was tested here before being left on:
#
#   blocked (403):  UNION SELECT, ../../etc/passwd, <script>, ;cat /etc/passwd
#   passed:         GET /health, GET /api/rooms
#   passed:         POST /api/bookings with guestName "Seán O'Brien" and notes
#                   "Arriving 1am; need 2 beds & a cot. Select room near exit
#                   -- thanks!"  -> 400 from Nest's own validation, not 403
#
# That last one is the real test: apostrophe, "Select", "--", ";" and "&" in
# free text, and CRS did not touch it.
#
# If a false positive does turn up in production, the fix is to move the
# crowdsecurity/crs line down into outofband_rules. CRS then still inspects
# every request and still gets the attacker banned through the appsec
# scenarios, but stops 403-ing the individual request. Check for them with:
#   docker exec crowdsec cscli alerts list --kind waf
#
# The virtual-patching and generic rules are inband for a different reason:
# they are specific -- a named CVE path, a .env fetch, a wp-uploads probe -- so
# a match is unambiguous and blocking on the spot is plainly correct.
name: asterias/appsec-api
default_remediation: ban

inband_rules:
  - crowdsecurity/base-config
  - crowdsecurity/vpatch-*
  - crowdsecurity/generic-*
  - crowdsecurity/crs

outofband_rules:
  - crowdsecurity/experimental-*
